name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — no value in finishing a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The storefront's HTML shell is assembled by the server from the Vite
      # manifest, and that coupling breaks silently: a CSS file attributed to a
      # shared chunk rather than the entry produced a completely unstyled
      # storefront that still returned 200 with all its content. Assert the
      # manifest is still shaped the way the server reads it.
      - name: Storefront build output is servable
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const m = JSON.parse(readFileSync('dist/client/.vite/manifest.json', 'utf8'))
            const key = 'src/storefront/entry-client.tsx'
            const entry = m[key]
            if (!entry) throw new Error('storefront entry missing from manifest')
            const seen = new Set(), css = []
            const walk = (k) => {
              if (seen.has(k)) return
              seen.add(k)
              const c = m[k]
              if (!c) return
              for (const f of c.css ?? []) css.push(f)
              for (const i of c.imports ?? []) walk(i)
            }
            walk(key)
            if (css.length === 0) throw new Error('no stylesheet reachable from the storefront entry')
            console.log('storefront entry', entry.file, 'with css', css.join(', '))
          "

  database:
    name: Migrations + RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The schema is the part hardest to fix after the fact, so every migration is
    # applied to an empty database on every PR. Uses the same Postgres image
    # Supabase runs, so the anon/authenticated roles and `extensions` schema that
    # the RLS policies depend on actually exist.
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pg_isready` (the service health check) goes true before the image finishes
      # installing extension files, so applying migrations immediately after it can
      # fail on a missing pg_trgm. Gate on something that proves the instance is
      # actually usable. This bit us locally; without the gate it is a CI flake that
      # only appears under load.
      - name: Wait for Postgres to be genuinely ready
        env:
          PGPASSWORD: postgres
        run: |
          for _ in $(seq 1 30); do
            if psql -h 127.0.0.1 -p 54322 -U postgres -qtAc \
                 "select 1 from pg_available_extensions where name = 'pg_trgm'" | grep -q 1; then
              echo "Postgres ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready in time."
          exit 1

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for file in supabase/migrations/*.sql; do
            echo "==> $file"
            psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Seed PSGC reference data
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm psgc:seed

      - name: Verify reference data landed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              barangays int;
              cities int;
            begin
              select count(*) into barangays from public.psgc_barangays;
              select count(*) into cities from public.psgc_cities;
              if barangays < 42000 then
                raise exception 'Expected >= 42000 barangays, found %', barangays;
              end if;
              if cities < 1600 then
                raise exception 'Expected >= 1600 cities, found %', cities;
              end if;
              raise notice 'PSGC OK: % cities, % barangays', cities, barangays;
            end
            \$\$;
          "

      # Phase 1's done-when: two tenants exist and neither can read a single row
      # of the other's data. Runs on every PR because a policy is trivially easy
      # to widen by accident and the failure mode is a cross-tenant data leak.
      - name: Tenancy isolation tests (RLS)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test

      # Phase 4's done-when: two concurrent checkouts for the last unit, exactly one
      # succeeds. Runs real parallel connections, because overselling is a problem
      # that only exists between simultaneous ones — a single session can simulate
      # the race but never reproduce it.
      - name: Inventory concurrency tests (oversell prevention)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test:concurrency

      # Phase 5's storefront read model. Runs against the same database the RLS
      # suite just used, so it exercises the anon path with real reference data.
      - name: Storefront RPCs are reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            begin
              if public.storefront_tenant_id('definitely-not-a-store') is not null then
                raise exception 'an unknown slug should not resolve';
              end if;
              if public.storefront_home('definitely-not-a-store') is not null then
                raise exception 'an unknown store should return null, not a payload';
              end if;
              raise notice 'storefront RPCs callable as anon';
            end
            \$\$;
          "

      # Phase 6's hard rule 6: never trust client-side prices. This is asserted in
      # the RLS suite (a tampered cart_items snapshot must not change what an order
      # charges), and the check below is the cheap smoke test that the guest path
      # exists at all and refuses an unknown store.
      - name: Guest cart path is reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            begin
              begin
                perform public.cart_create('definitely-not-a-store');
                raise exception 'cart_create should refuse an unknown store';
              exception when no_data_found then null;
              end;
              if public.cart_view(repeat('a', 64)) is not null then
                raise exception 'a forged cart token must not resolve';
              end if;
              raise notice 'guest cart path OK';
            end
            \$\$;
          "

      # The shipping zone layout is the seller's commercial arrangement — which
      # places they serve and what they charge. A buyer gets one resolved number
      # through the cart functions and nothing else. The tenancy suite asserts this
      # too; repeating it here means a stray `grant ... to anon` in a future
      # migration fails the build even if someone edits the suite.
      - name: Shipping configuration is not reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            declare t text;
            begin
              foreach t in array array['shipping_zones', 'shipping_zone_areas',
                                       'shipping_rates', 'shipping_weight_tiers']
              loop
                begin
                  execute format('select count(*) from public.%I', t);
                  raise exception 'anon must not be able to read public.%', t;
                exception when insufficient_privilege then null;
                end;
              end loop;

              begin
                perform public.quote_shipping(
                  gen_random_uuid(), '110000000', '112400000', '112402000', 50000, 500);
                raise exception 'anon must not be able to price an arbitrary address';
              exception when insufficient_privilege then null;
              end;

              raise notice 'shipping configuration is seller-only OK';
            end
            \$\$;
          "

      # Postgres grants EXECUTE on every new function to PUBLIC. `revoke ... from
      # anon, authenticated` does not remove a privilege held *through* PUBLIC — it
      # succeeds, changes nothing, and reports no error. That is how
      # `record_payment_event` — the function that marks orders paid — shipped
      # callable by anon for the length of one test run.
      #
      # This asserts the ACL directly rather than by attempting a call, so it fails
      # for a *new* money-moving function someone forgets to lock down, not only for
      # the six that exist today.
      - name: Money- and order-moving functions are not executable by PUBLIC
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              leaked text[] := '{}';
            begin
              foreach t in array array[
                'record_payment_event', 'attach_payment_charge',
                'payment_account_for_webhook', 'payment_credentials_for_payment',
                'sync_order_payment_status', 'log_integration_attempt',
                'orders_bulk_transition', 'orders_list', 'order_detail',
                'orders_packing_batch', 'create_manual_order', 'add_order_note',
                'set_courier_credentials', 'courier_credentials',
                'record_shipment', 'record_booking_failure',
                'record_shipment_event', 'record_tracking_sms', 'sms_credit_move',
                'sms_render_for_order', 'shipments_to_poll', 'sms_credit_balance_raw',
                'cod_import_statement', 'cod_post_remittance', 'cod_discard_remittance',
                'cod_reconciliation', 'record_rts', 'update_rts_cost',
                'buyer_risk_set_flag', 'buyer_risk_lookup',
                'buyer_risk_hash', 'buyer_risk_contribute', 'buyer_risk_refresh'
              ]
              loop
                if exists (
                  select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public' and p.proname = t
                    and (
                      p.proacl is null                                  -- default = PUBLIC
                      or has_function_privilege('anon', p.oid, 'EXECUTE')
                    )
                ) then
                  leaked := leaked || t;
                end if;
              end loop;

              if array_length(leaked, 1) > 0 then
                raise exception
                  'These are callable by anon and must not be: %. Use: revoke all on function ... from public;',
                  array_to_string(leaked, ', ');
              end if;
              raise notice 'money-moving functions are service-role only OK';
            end
            \$\$;
          "

      # The other half of the same lesson. `revoke ... from public` is what actually
      # locks a function down — and it revokes from `service_role` too, because in
      # Supabase that role has BYPASSRLS (which bypasses *policies*) and is not a
      # superuser (so it still needs *grants*). Phase 8's fix for the anon hole
      # silently broke the payment webhook that way, and the check above passed the
      # whole time: a function nobody can execute is trivially not anon-callable.
      #
      # Both directions are asserted now. A revoke that goes too far fails here
      # instead of in production.
      - name: The server can still execute the functions it needs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              blocked text[] := '{}';
            begin
              foreach t in array array[
                'record_payment_event', 'attach_payment_charge',
                'payment_account_for_webhook', 'payment_credentials_for_payment',
                'sync_order_payment_status', 'log_integration_attempt',
                'set_courier_credentials', 'courier_credentials',
                'record_shipment', 'record_booking_failure',
                'record_shipment_event', 'record_tracking_sms', 'sms_credit_move',
                'sms_render_for_order', 'shipments_to_poll'
              ]
              loop
                if exists (
                  select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public' and p.proname = t
                    and not has_function_privilege('service_role', p.oid, 'EXECUTE')
                ) then
                  blocked := blocked || t;
                end if;
              end loop;

              if array_length(blocked, 1) > 0 then
                raise exception
                  'The server cannot execute these, so the feature is dead: %. Add: grant execute on function ... to service_role;',
                  array_to_string(blocked, ', ');
              end if;
              raise notice 'service role can execute what it needs OK';
            end
            \$\$;
          "

      # The cross-tenant risk pool is the first table in the schema that spans
      # tenants on purpose, which makes it the one worth checking mechanically.
      # Three properties, none of which a policy alone would give you:
      #   - the aggregate and the hash->tenant map are readable by no role at all
      #   - the salt those hashes are built with is not readable either
      #   - the hash function is not callable, so nobody can ask "is this number
      #     in the pool?" one number at a time
      - name: The shared buyer-risk pool stays pseudonymous
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              r text;
              leaked text[] := '{}';
            begin
              foreach t in array array[
                'buyer_risk_signals', 'buyer_risk_contributions', 'platform_secrets'
              ] loop
                if not (select relrowsecurity and relforcerowsecurity
                        from pg_class where oid = ('public.' || t)::regclass) then
                  leaked := leaked || (t || ': RLS not forced');
                end if;
                if exists (select 1 from pg_policies
                            where schemaname = 'public' and tablename = t) then
                  leaked := leaked || (t || ': has a policy, so something can read it');
                end if;
                foreach r in array array['anon', 'authenticated', 'service_role'] loop
                  if has_table_privilege(r, ('public.' || t)::regclass, 'SELECT') then
                    leaked := leaked || (t || ': readable by ' || r);
                  end if;
                end loop;
              end loop;

              foreach r in array array['anon', 'authenticated'] loop
                if has_function_privilege(r, 'public.buyer_risk_hash(text)', 'EXECUTE') then
                  leaked := leaked || ('buyer_risk_hash callable by ' || r);
                end if;
              end loop;

              if array_length(leaked, 1) > 0 then
                raise exception 'The shared risk pool is not pseudonymous: %',
                  array_to_string(leaked, '; ');
              end if;
              raise notice 'shared buyer-risk pool is unreadable and unprobeable OK';
            end
            \$\$;
          "

      # The tracking page has no authentication at all, so the only thing standing
      # between an order number and a buyer's personal data is what
      # `public_tracking()` chooses to return. Asserted against a real order rather
      # than by reading the source: a `select *` slipped into the payload would
      # publish a name, phone and street to anyone holding a four-digit number.
      - name: The public tracking payload carries nothing personal
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant uuid;
              v_track  jsonb;
              v_leaks  text[] := '{}';
              k        text;
            begin
              if not has_function_privilege('anon', 'public.public_tracking(text,text,text)', 'EXECUTE') then
                raise exception 'anon cannot reach the tracking page at all — the whole phase is dead';
              end if;

              insert into public.tenants (name, slug, status)
              values ('CI Track', 'ci-track', 'active') returning id into v_tenant;
              insert into public.orders
                (tenant_id, order_number, contact_name, contact_phone, shipping_address,
                 subtotal_centavos, grand_total_centavos, payment_method)
              values (v_tenant, '0001', 'Jasmine Villanueva', '+639171234599',
                      '{\"cityName\":\"Davao City\",\"street\":\"21 Rizal Street\"}'::jsonb,
                      50000, 50000, 'cod');

              v_track := public.public_tracking('ci-track', null, '0001');
              if v_track is null then raise exception 'the tracking page found nothing'; end if;

              -- Anything that could identify or locate the buyer.
              foreach k in array array['21 Rizal Street', '+639171234599', 'Villanueva'] loop
                if v_track::text like '%' || k || '%' then v_leaks := v_leaks || k; end if;
              end loop;

              if array_length(v_leaks, 1) > 0 then
                raise exception 'public_tracking() leaks: %', array_to_string(v_leaks, ', ');
              end if;
              raise notice 'public tracking payload is safe to hand a stranger OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # Guard against the checked-in types drifting from the migrations. If this
      # fails, someone forgot `pnpm db:types` and the client types are lying.
      - name: database.types.ts matches the migrations
        run: |
          pnpm supabase gen types typescript \
            --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            > /tmp/generated.types.ts
          # Strip our hand-written header before comparing.
          tail -n +10 src/lib/supabase/database.types.ts > /tmp/committed.types.ts
          if ! diff -u /tmp/committed.types.ts /tmp/generated.types.ts; then
            echo "::error::src/lib/supabase/database.types.ts is stale. Run: pnpm db:types"
            exit 1
          fi
          echo "database.types.ts is up to date."
