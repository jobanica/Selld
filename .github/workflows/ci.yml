name: CI

# This workflow was registered and active for twenty phases and ran zero times.
# Not because Actions was off — because nothing ever matched a trigger. There is
# no `main` branch yet, and no pull request has been opened, so `push` and
# `pull_request` both had nothing to fire on. A workflow that cannot run is
# indistinguishable from a workflow that passes, and this one is the only thing
# standing between a schema change and a cross-tenant leak.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — no value in finishing a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The storefront's HTML shell is assembled by the server from the Vite
      # manifest, and that coupling breaks silently: a CSS file attributed to a
      # shared chunk rather than the entry produced a completely unstyled
      # storefront that still returned 200 with all its content. Assert the
      # manifest is still shaped the way the server reads it.
      - name: Storefront build output is servable
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const m = JSON.parse(readFileSync('dist/client/.vite/manifest.json', 'utf8'))
            const key = 'src/storefront/entry-client.tsx'
            const entry = m[key]
            if (!entry) throw new Error('storefront entry missing from manifest')
            const seen = new Set(), css = []
            const walk = (k) => {
              if (seen.has(k)) return
              seen.add(k)
              const c = m[k]
              if (!c) return
              for (const f of c.css ?? []) css.push(f)
              for (const i of c.imports ?? []) walk(i)
            }
            walk(key)
            if (css.length === 0) throw new Error('no stylesheet reachable from the storefront entry')
            console.log('storefront entry', entry.file, 'with css', css.join(', '))
          "

  database:
    name: Migrations + RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The schema is the part hardest to fix after the fact, so every migration is
    # applied to an empty database on every PR. Uses the same Postgres image
    # Supabase runs, so the anon/authenticated roles and `extensions` schema that
    # the RLS policies depend on actually exist.
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pg_isready` (the service health check) goes true before the image finishes
      # installing extension files, so applying migrations immediately after it can
      # fail on a missing pg_trgm. Gate on something that proves the instance is
      # actually usable. This bit us locally; without the gate it is a CI flake that
      # only appears under load.
      - name: Wait for Postgres to be genuinely ready
        env:
          PGPASSWORD: postgres
        run: |
          for _ in $(seq 1 30); do
            if psql -h 127.0.0.1 -p 54322 -U postgres -qtAc \
                 "select 1 from pg_available_extensions where name = 'pg_trgm'" | grep -q 1; then
              echo "Extensions installed."
              break
            fi
            sleep 1
          done

          # And pg_graphql is still moving after that. The image installs a schema
          # -version event trigger that fires on every DDL these migrations run,
          # and while the extension is being wired its sequence OID changes under
          # it — so applying migrations too early dies with "could not open
          # relation with OID" from a function no migration mentions. Wait for the
          # OID to stop moving rather than for a fixed sleep.
          prev=""; stable=0
          for _ in $(seq 1 60); do
            oid=$(psql -h 127.0.0.1 -p 54322 -U postgres -qtAc \
              "select coalesce((select oid from pg_class
                                 where oid = 'graphql.seq_schema_version'::regclass), 0)" 2>/dev/null || echo "")
            if [ -n "$oid" ] && [ "$oid" = "$prev" ]; then stable=$((stable + 1)); else stable=0; fi
            prev="$oid"
            if [ "$stable" -ge 5 ]; then
              echo "Postgres ready (pg_graphql settled at oid $prev)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready in time."
          exit 1

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for file in supabase/migrations/*.sql; do
            echo "==> $file"
            psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Seed PSGC reference data
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm psgc:seed

      - name: Verify reference data landed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              barangays int;
              cities int;
            begin
              select count(*) into barangays from public.psgc_barangays;
              select count(*) into cities from public.psgc_cities;
              if barangays < 42000 then
                raise exception 'Expected >= 42000 barangays, found %', barangays;
              end if;
              if cities < 1600 then
                raise exception 'Expected >= 1600 cities, found %', cities;
              end if;
              raise notice 'PSGC OK: % cities, % barangays', cities, barangays;
            end
            \$\$;
          "

      # Phase 1's done-when: two tenants exist and neither can read a single row
      # of the other's data. Runs on every PR because a policy is trivially easy
      # to widen by accident and the failure mode is a cross-tenant data leak.
      - name: Tenancy isolation tests (RLS)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test

      # Phase 4's done-when: two concurrent checkouts for the last unit, exactly one
      # succeeds. Runs real parallel connections, because overselling is a problem
      # that only exists between simultaneous ones — a single session can simulate
      # the race but never reproduce it.
      - name: Inventory concurrency tests (oversell prevention)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test:concurrency

      # Phase 5's storefront read model. Runs against the same database the RLS
      # suite just used, so it exercises the anon path with real reference data.
      - name: Storefront RPCs are reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            begin
              if public.storefront_tenant_id('definitely-not-a-store') is not null then
                raise exception 'an unknown slug should not resolve';
              end if;
              if public.storefront_home('definitely-not-a-store') is not null then
                raise exception 'an unknown store should return null, not a payload';
              end if;
              raise notice 'storefront RPCs callable as anon';
            end
            \$\$;
          "

      # Phase 6's hard rule 6: never trust client-side prices. This is asserted in
      # the RLS suite (a tampered cart_items snapshot must not change what an order
      # charges), and the check below is the cheap smoke test that the guest path
      # exists at all and refuses an unknown store.
      - name: Guest cart path is reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            begin
              begin
                perform public.cart_create('definitely-not-a-store');
                raise exception 'cart_create should refuse an unknown store';
              exception when no_data_found then null;
              end;
              if public.cart_view(repeat('a', 64)) is not null then
                raise exception 'a forged cart token must not resolve';
              end if;
              raise notice 'guest cart path OK';
            end
            \$\$;
          "

      # The shipping zone layout is the seller's commercial arrangement — which
      # places they serve and what they charge. A buyer gets one resolved number
      # through the cart functions and nothing else. The tenancy suite asserts this
      # too; repeating it here means a stray `grant ... to anon` in a future
      # migration fails the build even if someone edits the suite.
      - name: Shipping configuration is not reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            set role anon;
            do \$\$
            declare t text;
            begin
              foreach t in array array['shipping_zones', 'shipping_zone_areas',
                                       'shipping_rates', 'shipping_weight_tiers']
              loop
                begin
                  execute format('select count(*) from public.%I', t);
                  raise exception 'anon must not be able to read public.%', t;
                exception when insufficient_privilege then null;
                end;
              end loop;

              begin
                perform public.quote_shipping(
                  gen_random_uuid(), '110000000', '112400000', '112402000', 50000, 500);
                raise exception 'anon must not be able to price an arbitrary address';
              exception when insufficient_privilege then null;
              end;

              raise notice 'shipping configuration is seller-only OK';
            end
            \$\$;
          "

      # Postgres grants EXECUTE on every new function to PUBLIC. `revoke ... from
      # anon, authenticated` does not remove a privilege held *through* PUBLIC — it
      # succeeds, changes nothing, and reports no error. That is how
      # `record_payment_event` — the function that marks orders paid — shipped
      # callable by anon for the length of one test run.
      #
      # This asserts the ACL directly rather than by attempting a call, so it fails
      # for a *new* money-moving function someone forgets to lock down, not only for
      # the six that exist today.
      - name: Money- and order-moving functions are not executable by PUBLIC
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              leaked text[] := '{}';
            begin
              foreach t in array array[
                'record_payment_event', 'attach_payment_charge',
                'payment_account_for_webhook', 'payment_credentials_for_payment',
                'sync_order_payment_status', 'log_integration_attempt',
                'orders_bulk_transition', 'orders_list', 'order_detail',
                'orders_packing_batch', 'create_manual_order', 'add_order_note',
                'set_courier_credentials', 'courier_credentials',
                'record_shipment', 'record_booking_failure',
                'record_shipment_event', 'record_tracking_sms', 'sms_credit_move',
                'sms_render_for_order', 'shipments_to_poll', 'sms_credit_balance_raw',
                'cod_import_statement', 'cod_post_remittance', 'cod_discard_remittance',
                'cod_reconciliation', 'cod_remittance_summary', 'cod_remittance_lines',
                'record_rts', 'update_rts_cost', 'rts_report',
                'buyer_risk_set_flag', 'buyer_risk_lookup',
                'buyer_risk_hash', 'buyer_risk_contribute', 'buyer_risk_refresh',
                'live_ingest_comment', 'live_session_for_ref', 'live_expire_claims',
                'reserve_stock_raw', 'release_reservation_raw',
                'social_page_token', 'set_social_page_token', 'social_account_connect',
                'social_account_for_page', 'social_account_for_thread',
                'record_inbound_message', 'record_outbound_message',
                'record_post_comment', 'record_comment_reply', 'record_comment_dm',
                'message_send_allowed_raw', 'auto_reply_for_raw', 'tenant_store_url',
                'inbox_threads', 'inbox_thread', 'inbox_mark_read',
                'message_send_allowed', 'auto_reply_for', 'social_account_disconnect',
                'customers_list', 'customer_profile', 'customer_segment_preview',
                'customer_segment_count', 'customer_segment_save', 'customer_segments_list',
                'customers_merge', 'customers_import',
                'customer_segment_match', 'customer_stats_refresh',
                'broadcast_preview', 'broadcast_save', 'broadcast_start',
                'broadcast_report', 'broadcasts_list', 'broadcasts_due',
                'broadcast_claim_next', 'broadcast_record_send', 'broadcast_channel_for',
                'broadcast_render', 'short_link_create',
                'abandoned_carts_sweep', 'abandoned_carts_due',
                'abandoned_cart_record_reminder', 'abandoned_carts_report',
                'sms_segments',
                'marketplace_credentials', 'set_marketplace_credentials',
                'marketplace_push_claim', 'marketplace_push_record',
                'marketplace_order_ingest', 'marketplace_listings_import',
                'marketplace_connections_due', 'marketplace_sellable',
                'marketplace_connect', 'marketplace_set_sync',
                'marketplace_map_listing', 'marketplace_overview',
                'marketplace_issue_resolve',
                'analytics_profit', 'analytics_commission_kept', 'analytics_breakdown',
                'analytics_trends', 'ad_spend_record', 'ad_spend_list',
                'plan_limit', 'plan_has_feature', 'billing_allows_writes',
                'billing_due_claim', 'billing_invoice_attach', 'billing_invoice_settle',
                'billing_invoice_note_failure', 'billing_dunning_run',
                'credit_purchase_start', 'credit_purchase_attach', 'credit_purchase_settle',
                'subscription_overview', 'subscription_plans', 'subscription_change_plan',
                'subscription_cancel', 'subscription_resume',
                'impersonate_begin', 'impersonate_end', 'is_impersonating',
                'is_platform_admin', 'is_reseller_of', 'current_reseller',
                'plan_is_visible', 'reseller_is_visible', 'reseller_require',
                'platform_overview', 'platform_tenants', 'platform_set_plan',
                'platform_impersonation_log', 'platform_announce', 'platform_create_reseller',
                'reseller_plan_upsert', 'reseller_create_tenant', 'reseller_set_price',
                'reseller_overview', 'reseller_revenue_split', 'reseller_set_branding',
                'reseller_branding', 'announcements_active', 'my_platform_roles',
                'rate_limit_hit', 'rate_limit_sweep', 'record_checkout_consent',
                'customer_may_market', 'set_marketing_consent',
                'dsr_open', 'dsr_close', 'dsr_list', 'dsr_export', 'dsr_serve_deletion',
                'breach_record', 'breach_update', 'breach_list'
              ]
              loop
                if exists (
                  select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public' and p.proname = t
                    and (
                      p.proacl is null                                  -- default = PUBLIC
                      or has_function_privilege('anon', p.oid, 'EXECUTE')
                    )
                ) then
                  leaked := leaked || t;
                end if;
              end loop;

              if array_length(leaked, 1) > 0 then
                raise exception
                  'These are callable by anon and must not be: %. Use: revoke all on function ... from public;',
                  array_to_string(leaked, ', ');
              end if;
              raise notice 'money-moving functions are service-role only OK';
            end
            \$\$;
          "

      # The other half of the same lesson. `revoke ... from public` is what actually
      # locks a function down — and it revokes from `service_role` too, because in
      # Supabase that role has BYPASSRLS (which bypasses *policies*) and is not a
      # superuser (so it still needs *grants*). Phase 8's fix for the anon hole
      # silently broke the payment webhook that way, and the check above passed the
      # whole time: a function nobody can execute is trivially not anon-callable.
      #
      # Both directions are asserted now. A revoke that goes too far fails here
      # instead of in production.
      - name: The server can still execute the functions it needs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              blocked text[] := '{}';
            begin
              foreach t in array array[
                'record_payment_event', 'attach_payment_charge',
                'payment_account_for_webhook', 'payment_credentials_for_payment',
                'sync_order_payment_status', 'log_integration_attempt',
                'set_courier_credentials', 'courier_credentials',
                'record_shipment', 'record_booking_failure',
                'record_shipment_event', 'record_tracking_sms', 'sms_credit_move',
                'sms_render_for_order', 'shipments_to_poll',
                'live_ingest_comment', 'live_session_for_ref', 'live_expire_claims',
                'social_page_token', 'set_social_page_token', 'social_account_connect',
                'social_account_for_page', 'social_account_for_thread',
                'record_inbound_message', 'record_outbound_message',
                'record_post_comment', 'record_comment_reply', 'record_comment_dm',
                'message_send_allowed_raw',
                'broadcast_claim_next', 'broadcast_record_send', 'short_link_create',
                'short_link_follow', 'broadcasts_due', 'abandoned_carts_sweep',
                'abandoned_carts_due', 'abandoned_cart_record_reminder',
                'discount_evaluate', 'discount_auto_best', 'cart_apply_discount',
                'marketplace_credentials', 'set_marketplace_credentials',
                'marketplace_push_claim', 'marketplace_push_record',
                'marketplace_order_ingest', 'marketplace_listings_import',
                'marketplace_connections_due', 'marketplace_sellable',
                'billing_due_claim', 'billing_invoice_attach', 'billing_invoice_settle',
                'billing_invoice_note_failure', 'billing_dunning_run',
                'credit_purchase_attach', 'credit_purchase_settle', 'impersonate_begin',
                'rate_limit_hit', 'rate_limit_sweep', 'record_checkout_consent'
              ]
              loop
                if exists (
                  select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public' and p.proname = t
                    and not has_function_privilege('service_role', p.oid, 'EXECUTE')
                ) then
                  blocked := blocked || t;
                end if;
              end loop;

              if array_length(blocked, 1) > 0 then
                raise exception
                  'The server cannot execute these, so the feature is dead: %. Add: grant execute on function ... to service_role;',
                  array_to_string(blocked, ', ');
              end if;
              raise notice 'service role can execute what it needs OK';
            end
            \$\$;
          "

      # The cross-tenant risk pool is the first table in the schema that spans
      # tenants on purpose, which makes it the one worth checking mechanically.
      # Three properties, none of which a policy alone would give you:
      #   - the aggregate and the hash->tenant map are readable by no role at all
      #   - the salt those hashes are built with is not readable either
      #   - the hash function is not callable, so nobody can ask "is this number
      #     in the pool?" one number at a time
      - name: The shared buyer-risk pool stays pseudonymous
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              t text;
              r text;
              leaked text[] := '{}';
            begin
              foreach t in array array[
                'buyer_risk_signals', 'buyer_risk_contributions', 'platform_secrets'
              ] loop
                if not (select relrowsecurity and relforcerowsecurity
                        from pg_class where oid = ('public.' || t)::regclass) then
                  leaked := leaked || (t || ': RLS not forced');
                end if;
                if exists (select 1 from pg_policies
                            where schemaname = 'public' and tablename = t) then
                  leaked := leaked || (t || ': has a policy, so something can read it');
                end if;
                foreach r in array array['anon', 'authenticated', 'service_role'] loop
                  if has_table_privilege(r, ('public.' || t)::regclass, 'SELECT') then
                    leaked := leaked || (t || ': readable by ' || r);
                  end if;
                end loop;
              end loop;

              foreach r in array array['anon', 'authenticated'] loop
                if has_function_privilege(r, 'public.buyer_risk_hash(text)', 'EXECUTE') then
                  leaked := leaked || ('buyer_risk_hash callable by ' || r);
                end if;
              end loop;

              if array_length(leaked, 1) > 0 then
                raise exception 'The shared risk pool is not pseudonymous: %',
                  array_to_string(leaked, '; ');
              end if;
              raise notice 'shared buyer-risk pool is unreadable and unprobeable OK';
            end
            \$\$;
          "

      # The tracking page has no authentication at all, so the only thing standing
      # between an order number and a buyer's personal data is what
      # `public_tracking()` chooses to return. Asserted against a real order rather
      # than by reading the source: a `select *` slipped into the payload would
      # publish a name, phone and street to anyone holding a four-digit number.
      - name: The public tracking payload carries nothing personal
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant uuid;
              v_track  jsonb;
              v_leaks  text[] := '{}';
              k        text;
            begin
              if not has_function_privilege('anon', 'public.public_tracking(text,text,text)', 'EXECUTE') then
                raise exception 'anon cannot reach the tracking page at all — the whole phase is dead';
              end if;

              insert into public.tenants (name, slug, status)
              values ('CI Track', 'ci-track', 'active') returning id into v_tenant;
              insert into public.orders
                (tenant_id, order_number, contact_name, contact_phone, shipping_address,
                 subtotal_centavos, grand_total_centavos, payment_method)
              values (v_tenant, '0001', 'Jasmine Villanueva', '+639171234599',
                      '{\"cityName\":\"Davao City\",\"street\":\"21 Rizal Street\"}'::jsonb,
                      50000, 50000, 'cod');

              v_track := public.public_tracking('ci-track', null, '0001');
              if v_track is null then raise exception 'the tracking page found nothing'; end if;

              -- Anything that could identify or locate the buyer.
              foreach k in array array['21 Rizal Street', '+639171234599', 'Villanueva'] loop
                if v_track::text like '%' || k || '%' then v_leaks := v_leaks || k; end if;
              end loop;

              if array_length(v_leaks, 1) > 0 then
                raise exception 'public_tracking() leaks: %', array_to_string(v_leaks, ', ');
              end if;
              raise notice 'public tracking payload is safe to hand a stranger OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # A page access token can post as the seller, read their inbox and message
      # their customers, so it is the most dangerous secret in the schema. Three
      # properties, asserted against a real stored token rather than by reading the
      # source: no role can select the column, the safe view does not carry it, and
      # the decrypt function is not callable by anyone with a session.
      - name: A page access token is unreadable by any client role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant  uuid;
              v_account uuid;
              v_leaks   text[] := '{}';
              r         text;
            begin
              insert into public.tenants (name, slug, status)
              values ('CI Social', 'ci-social', 'active') returning id into v_tenant;
              insert into public.social_accounts (tenant_id, platform, page_id, page_name)
              values (v_tenant, 'facebook', 'CI-PAGE-1', 'CI page') returning id into v_account;
              perform public.set_social_page_token(v_account, 'TOP-SECRET-TOKEN', 'ci-key');

              foreach r in array array['anon', 'authenticated'] loop
                if has_table_privilege(r, 'public.social_accounts', 'SELECT') then
                  v_leaks := v_leaks || (r || ' can select social_accounts');
                end if;
                if has_function_privilege(r, 'public.social_page_token(text,text,text)', 'EXECUTE') then
                  v_leaks := v_leaks || (r || ' can call social_page_token');
                end if;
                if has_function_privilege(r, 'public.set_social_page_token(uuid,text,text,timestamptz,boolean)', 'EXECUTE') then
                  v_leaks := v_leaks || (r || ' can call set_social_page_token');
                end if;
              end loop;

              -- The safe view exists to answer \"is this connected\" without ever
              -- carrying the thing that makes it connected.
              if exists (
                select 1 from information_schema.columns
                where table_schema = 'public' and table_name = 'social_accounts_safe'
                  and column_name in ('token_encrypted', 'token')
              ) then
                v_leaks := v_leaks || 'social_accounts_safe exposes the token';
              end if;

              if array_length(v_leaks, 1) > 0 then
                raise exception 'page token is reachable: %', array_to_string(v_leaks, ', ');
              end if;
              raise notice 'page access tokens are unreadable by any client role OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # A customer's lifetime value is a projection of their orders, maintained by
      # trigger. The invariant is the same shape as `sum(delta) = on_hand` for
      # inventory, and it is asserted the same way: recompute from the ledger and
      # compare. Anything that starts writing those columns by hand — a helpful
      # backfill, a migration that "just sets it" — fails here.
      - name: Customer totals equal a recomputation from their orders
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant   uuid;
              v_customer uuid;
              v_drift    int;
            begin
              insert into public.tenants (name, slug, status)
              values ('CI CRM', 'ci-crm', 'active') returning id into v_tenant;
              insert into public.customers (tenant_id, name, phone)
              values (v_tenant, 'CI Buyer', '+639171230001') returning id into v_customer;

              insert into public.orders
                (tenant_id, order_number, customer_id, contact_name, contact_phone,
                 shipping_address, subtotal_centavos, grand_total_centavos,
                 payment_method, payment_status, fulfillment_status)
              values
                (v_tenant, 'C1', v_customer, 'CI Buyer', '+639171230001', '{}'::jsonb,
                 100000, 100000, 'cod', 'unpaid', 'delivered'),
                (v_tenant, 'C2', v_customer, 'CI Buyer', '+639171230001', '{}'::jsonb,
                 50000, 50000, 'cod', 'unpaid', 'rts'),
                (v_tenant, 'C3', v_customer, 'CI Buyer', '+639171230001', '{}'::jsonb,
                 70000, 70000, 'cod', 'unpaid', 'cancelled');

              select count(*)::int into v_drift
              from public.customers c
                join lateral (
                  select
                    count(*) filter (where o.fulfillment_status <> 'cancelled')::int as orders,
                    coalesce(sum(o.grand_total_centavos) filter (
                      where o.fulfillment_status = 'delivered'
                         or o.payment_status = 'paid'), 0) as spent
                  from public.orders o where o.customer_id = c.id) t on true
              where c.id = v_customer
                and (c.total_orders <> t.orders or c.total_spent_centavos <> t.spent);

              if v_drift > 0 then
                raise exception 'a customer total does not match its orders';
              end if;

              -- 100000 delivered; the RTS and the cancellation are not revenue.
              if (select total_spent_centavos from public.customers where id = v_customer) <> 100000 then
                raise exception 'lifetime value counted money that never arrived';
              end if;

              begin
                update public.customers set total_spent_centavos = 1 where id = v_customer;
                raise exception 'the projection is writable by hand';
              exception when check_violation then
                null;
              end;

              raise notice 'customer totals are a projection of their orders OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # Phase 16 adds four more counters of the same shape, and they are the ones a
      # seller *decides* on: "this voucher has been used 43 times" is what keeps it
      # running, and "this send cost 790 credits" is what the SMS bill is
      # reconciled against. Both shipped writable by hand — the guards that make
      # them projections were added only after the tenancy suite asked for them.
      #
      # Asserted the same way as the two above: recompute from the rows the
      # counter is a cache of, then try to write it and require the guard.
      - name: Voucher and broadcast counters are projections, not fields
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant   uuid;
              v_customer uuid;
              v_discount uuid;
              v_order    uuid;
              v_blast    uuid;
              v_drift    int;
            begin
              insert into public.tenants (name, slug, status)
              values ('CI Blast', 'ci-blast', 'active') returning id into v_tenant;
              insert into public.customers (tenant_id, name, phone)
              values (v_tenant, 'CI Buyer', '+639171230002') returning id into v_customer;
              insert into public.discounts
                (tenant_id, code, name, kind, value, min_subtotal_centavos)
              values (v_tenant, 'CIPAY', 'CI 10%', 'percent', 1000, 0)
              returning id into v_discount;

              insert into public.orders
                (tenant_id, order_number, customer_id, contact_name, contact_phone,
                 shipping_address, subtotal_centavos, discount_total_centavos,
                 grand_total_centavos, payment_method, payment_status, fulfillment_status)
              values (v_tenant, 'B1', v_customer, 'CI Buyer', '+639171230002', '{}'::jsonb,
                      100000, 10000, 90000, 'cod', 'unpaid', 'delivered')
              returning id into v_order;

              insert into public.discount_redemptions
                (tenant_id, discount_id, order_id, customer_id, phone, amount_centavos)
              values (v_tenant, v_discount, v_order, v_customer, '+639171230002', 10000);

              select count(*)::int into v_drift
              from public.discounts d
              where d.id = v_discount
                and d.used_count <> (select count(*)::int from public.discount_redemptions r
                                     where r.discount_id = d.id);
              if v_drift > 0 then
                raise exception 'a voucher usage count does not match its redemptions';
              end if;

              insert into public.broadcasts (tenant_id, name, body, segment_definition)
              values (v_tenant, 'CI blast', 'hello {{storeUrl}}', '{}'::jsonb)
              returning id into v_blast;
              insert into public.broadcast_recipients
                (tenant_id, broadcast_id, customer_id, channel, address, status, segments, credits)
              values
                (v_tenant, v_blast, v_customer, 'sms', '+639171230002', 'sent', 1, 1);

              if (select sent_count from public.broadcasts where id = v_blast) <> 1
                 or (select credits_spent from public.broadcasts where id = v_blast) <> 1 then
                raise exception 'a broadcast counter does not match its recipients';
              end if;

              begin
                update public.discounts set used_count = 99 where id = v_discount;
                raise exception 'a voucher usage count is writable by hand';
              exception when check_violation then
                null;
              end;

              begin
                update public.broadcasts set credits_spent = 99 where id = v_blast;
                raise exception 'what a send cost is writable by hand';
              exception when check_violation then
                null;
              end;

              raise notice 'voucher and broadcast counters are projections OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # Profit is the most sensitive number in the product, and the product
      # breakdown carries cost prices — the very thing `products_public` exists to
      # keep away from a buyer. It would be a poor joke to hide `cost_centavos`
      # from the storefront and then hand it back through an analytics function
      # that Postgres granted to PUBLIC by default.
      #
      # The arithmetic guard is asserted here too, because every way of getting it
      # wrong makes profit look *better*: a missing cost silently improves the
      # number, which is the one direction it must never be wrong in.
      - name: Profit never counts money that has not arrived
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_user   uuid;
              v_tenant uuid;
              v_loc    uuid;
              v_p      uuid;
              v_v      uuid;
              v_o      uuid;
              v_month  date;
              v_result jsonb;
            begin
              insert into auth.users (id, email)
              values (gen_random_uuid(), 'ci-profit@example.ph') returning id into v_user;
              -- Both forms, the way tests.login() does it. The Postgres image CI
              -- runs ships a stub auth.uid() that reads only the legacy singular
              -- GUC; GoTrue replaces it with the coalescing version on a real
              -- project, and GoTrue never runs here. Setting request.jwt.claims
              -- alone leaves auth.uid() null, and every membership check then
              -- refuses the caller as unauthenticated -- which reads like a
              -- broken function and is a probe that never signed in.
              perform set_config('request.jwt.claim.sub', v_user::text, true);
              perform set_config('request.jwt.claims',
                json_build_object('sub', v_user, 'role', 'authenticated')::text, true);
              v_tenant := (public.create_tenant('CI Profit', 'ci-profit')).id;
              v_month := date_trunc('month', (now() at time zone 'Asia/Manila')::date)::date;
              select id into v_loc from public.locations where tenant_id = v_tenant limit 1;

              insert into public.products (tenant_id, name, slug, status)
              values (v_tenant, 'Widget', 'widget', 'active') returning id into v_p;
              insert into public.product_variants
                (tenant_id, product_id, sku, price_centavos, cost_centavos)
              values (v_tenant, v_p, 'W-1', 100000, 60000) returning id into v_v;

              -- Delivered: revenue.
              insert into public.orders
                (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                 subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                 fulfillment_status, source, placed_at)
              values (v_tenant, 'CI-1', '{}'::jsonb, 'A', '+639171230006', 100000, 100000,
                      'cod', 'unpaid', 'delivered', 'storefront',
                      (v_month + time '09:00') at time zone 'Asia/Manila')
              returning id into v_o;
              insert into public.order_items
                (tenant_id, order_id, variant_id, product_name, qty, unit_price_centavos,
                 cost_centavos, line_total_centavos)
              values (v_tenant, v_o, v_v, 'Widget', 1, 100000, 60000, 100000);

              -- Shipped COD, cancelled, and returned: none of them are revenue.
              insert into public.orders
                (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                 subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                 fulfillment_status, source, placed_at)
              values
                (v_tenant, 'CI-2', '{}'::jsonb, 'B', '+639171230007', 500000, 500000,
                 'cod', 'unpaid', 'shipped', 'storefront',
                 (v_month + time '09:10') at time zone 'Asia/Manila'),
                (v_tenant, 'CI-3', '{}'::jsonb, 'C', '+639171230008', 900000, 900000,
                 'cod', 'unpaid', 'cancelled', 'storefront',
                 (v_month + time '09:20') at time zone 'Asia/Manila'),
                (v_tenant, 'CI-4', '{}'::jsonb, 'D', '+639171230009', 700000, 700000,
                 'cod', 'unpaid', 'rts', 'storefront',
                 (v_month + time '09:30') at time zone 'Asia/Manila');

              v_result := public.analytics_profit(v_tenant);

              if (v_result ->> 'revenue')::bigint <> 100000 then
                raise exception
                  'revenue counted money that never arrived: expected 100000, got %',
                  v_result ->> 'revenue';
              end if;
              if (v_result ->> 'inFlight')::bigint <> 500000 then
                raise exception 'the COD in a van was not reported: %',
                  v_result ->> 'inFlight';
              end if;
              if (v_result -> 'costs' ->> 'cogs')::bigint <> 60000 then
                raise exception 'COGS is wrong: %', v_result -> 'costs' ->> 'cogs';
              end if;
              if (v_result ->> 'profit')::bigint <> 40000 then
                raise exception 'profit is wrong: %', v_result ->> 'profit';
              end if;

              -- An uncosted line must lower coverage rather than raise profit
              -- quietly.
              insert into public.orders
                (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                 subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                 fulfillment_status, source, placed_at)
              values (v_tenant, 'CI-5', '{}'::jsonb, 'E', '+639171230010', 100000, 100000,
                      'gcash', 'paid', 'delivered', 'storefront',
                      (v_month + time '09:40') at time zone 'Asia/Manila')
              returning id into v_o;
              insert into public.order_items
                (tenant_id, order_id, product_name, qty, unit_price_centavos, line_total_centavos)
              values (v_tenant, v_o, 'Mystery', 1, 100000, 100000);

              v_result := public.analytics_profit(v_tenant);
              if (v_result -> 'coverage' ->> 'itemsWithoutCost')::int <> 1 then
                raise exception 'an uncosted item was not reported';
              end if;
              if (v_result -> 'coverage' ->> 'costedFraction')::numeric >= 1 then
                raise exception 'coverage did not drop for an uncosted item';
              end if;

              raise notice 'profit never counts money that has not arrived OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # A marketplace access token can list, reprice and cancel as the seller,
      # which puts it in the same class as a page access token. `social_accounts`
      # earned its own CI step for that; this is the same check for the same
      # reason, and it is mechanical because "no policy at all" is the kind of
      # thing a later migration adds one to without noticing.
      - name: Marketplace access tokens are unreadable by any client role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              r text;
              leaked text[] := '{}';
            begin
              foreach r in array array['anon', 'authenticated'] loop
                if has_table_privilege(r, 'public.marketplace_connections', 'SELECT') then
                  leaked := leaked || (r || ' can select marketplace_connections')::text;
                end if;
                if has_function_privilege(r, 'public.marketplace_credentials(uuid, text)', 'EXECUTE') then
                  leaked := leaked || (r || ' can execute marketplace_credentials')::text;
                end if;
              end loop;

              -- RLS on and no policy at all, the same shape as social_accounts.
              if not (select relrowsecurity from pg_class
                      where oid = 'public.marketplace_connections'::regclass) then
                leaked := leaked || 'RLS is off on marketplace_connections'::text;
              end if;
              if exists (select 1 from pg_policies
                         where schemaname = 'public' and tablename = 'marketplace_connections') then
                -- Cast to text. Without it, appending an untyped literal to a
                -- text array resolves to array-concatenation and the literal is
                -- parsed as an array, so a message containing a comma fails as a
                -- malformed array literal instead of saying what is wrong.
                --
                -- No double quotes or backticks in these comments either: this
                -- SQL lives inside a double-quoted shell string, where the first
                -- ends it and the second is command substitution.
                leaked := leaked || 'marketplace_connections has a policy; a client role could read the token'::text;
              end if;

              -- And the safe view must not have grown a column that carries one.
              if exists (
                select 1 from information_schema.columns
                where table_schema = 'public' and table_name = 'marketplace_connections_safe'
                  and column_name in ('credentials_encrypted', 'access_token', 'refresh_token')
              ) then
                leaked := leaked || 'marketplace_connections_safe exposes a credential column'::text;
              end if;

              if array_length(leaked, 1) > 0 then
                raise exception 'Marketplace credentials are reachable: %',
                  array_to_string(leaked, '; ');
              end if;
              raise notice 'marketplace access tokens are unreadable by any client role OK';
            end
            \$\$;
          "

      # One marketplace order id can only ever be one Selld order. A pull is
      # repeated by design — the worker asks "anything since 09:00" every few
      # minutes — so without this index a retry, or a second worker, packs the
      # parcel twice. `orders.channel_ref` existed since phase 6 and nothing had
      # ever written it, so nothing had ever needed it to be unique.
      - name: A marketplace order cannot be packed twice
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare v_tenant uuid;
            begin
              insert into public.tenants (name, slug, status)
              values ('CI Marketplace', 'ci-mp', 'active') returning id into v_tenant;

              insert into public.orders
                (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                 subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                 fulfillment_status, source, channel_ref)
              values (v_tenant, 'M1', '{}'::jsonb, 'Buyer', '+639171230003', 0, 0,
                      'cod', 'unpaid', 'pending', 'marketplace', 'SPE-CI-1');

              begin
                insert into public.orders
                  (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                   subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                   fulfillment_status, source, channel_ref)
                values (v_tenant, 'M2', '{}'::jsonb, 'Buyer', '+639171230003', 0, 0,
                        'cod', 'unpaid', 'pending', 'marketplace', 'SPE-CI-1');
                raise exception 'a marketplace order id can be used twice';
              exception when unique_violation then
                null;
              end;

              -- Partial, so storefront orders — which have no marketplace id —
              -- must still coexist freely.
              insert into public.orders
                (tenant_id, order_number, shipping_address, contact_name, contact_phone,
                 subtotal_centavos, grand_total_centavos, payment_method, payment_status,
                 fulfillment_status, source)
              values (v_tenant, 'M3', '{}'::jsonb, 'A', '+639171230004', 0, 0,
                      'cod', 'unpaid', 'pending', 'storefront'),
                     (v_tenant, 'M4', '{}'::jsonb, 'B', '+639171230005', 0, 0,
                      'cod', 'unpaid', 'pending', 'storefront');

              raise notice 'a marketplace order cannot be packed twice OK';
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # The number on the button has to be the number on the bill. Both sides
      # measure `sms_segments` of the *rendered* message — not of the template —
      # because `{{storeUrl}}` is twelve characters in the seller's textarea and
      # about forty on the recipient's phone. Quoting the template under-bills a
      # 140-character draft by half, and the seller finds out from their credit
      # balance rather than from the screen they agreed on.
      - name: A broadcast is charged what it was quoted
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_tenant uuid;
              v_user   uuid;
              v_body   text;
              v_quote  jsonb;
              v_blast  uuid;
              v_frozen int;
              n int;
            begin
              insert into auth.users (id, email)
              values (gen_random_uuid(), 'ci-blast@example.ph') returning id into v_user;
              perform set_config('request.jwt.claim.sub', v_user::text, true);
              perform set_config('request.jwt.claims',
                json_build_object('sub', v_user, 'role', 'authenticated')::text, true);
              v_tenant := (public.create_tenant('CI Quote', 'ci-quote')).id;

              for n in 1..5 loop
                insert into public.customers (tenant_id, name, phone, source)
                values (v_tenant, 'Buyer ' || n, '+63918000000' || n, 'import');
              end loop;
              perform public.sms_credit_move(v_tenant, 100, 'topup', null, 'ci');

              -- 140 characters. Plus the four braces of the placeholder, which are
              -- GSM-7 extension characters at two septets each, that is 144 — one
              -- segment. What is sent is 165 characters, which is two.
              v_body := 'Payday sale po! 15% off sa lahat ng skincare at bags, '
                     || 'hanggang bukas na lang ito, huwag na palampasin ito: '
                     || '{{storeUrl}} Maraming salamat po!';

              if length(v_body) <> 140 then
                raise exception 'the fixture body drifted: % characters', length(v_body);
              end if;
              if public.sms_segments(v_body) <> 1 then
                raise exception 'the template alone should measure one segment';
              end if;

              v_quote := public.broadcast_preview(v_tenant, '{}'::jsonb, v_body, 'auto', null);
              if (v_quote ->> 'segments')::int <> 2 then
                raise exception
                  'the quote measured the template, not the message: % segments',
                  v_quote ->> 'segments';
              end if;

              v_blast := public.broadcast_save(v_tenant, 'CI quote', v_body, '{}'::jsonb, 'auto');
              perform public.broadcast_start(v_blast);

              select coalesce(sum(segments), 0) into v_frozen
              from public.broadcast_recipients
              where broadcast_id = v_blast and channel = 'sms';

              if v_frozen <> (v_quote ->> 'credits')::int then
                raise exception 'quoted % credits and froze %',
                  v_quote ->> 'credits', v_frozen;
              end if;

              raise notice 'a broadcast is charged what it was quoted OK (% credits)', v_frozen;
              raise exception 'rollback';
            exception when others then
              if sqlerrm <> 'rollback' then raise; end if;
            end
            \$\$;
          "

      # `ON DELETE SET NULL` on a composite foreign key nulls *every* column in
      # the key — including the denormalised `tenant_id`, which is NOT NULL on
      # every table that carries one. Sixteen constraints shipped that way, and the
      # symptom is that deleting a product, a category or a customer simply raises.
      #
      # Postgres 15 added `ON DELETE SET NULL (column_list)`. This asserts that
      # every such constraint uses it, because the next composite FK somebody adds
      # will be written from the pattern in CLAUDE.md and will have the same hole.
      - name: No composite FK nulls a NOT NULL column on delete
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare bad text[];
            begin
              select array_agg(cl.relname || '.' || c.conname)
                into bad
              from pg_constraint c
                join pg_class cl on cl.oid = c.conrelid
              where c.contype = 'f'
                and c.confdeltype = 'n'                       -- ON DELETE SET NULL
                and array_length(c.conkey, 1) > 1             -- composite
                and exists (                                  -- ... over a NOT NULL column
                  select 1 from unnest(c.conkey) k
                    join pg_attribute a
                      on a.attrelid = c.conrelid and a.attnum = k
                  where a.attnotnull
                    -- A NOT NULL column breaks the delete when it is one of the
                    -- columns that actually gets nulled: either it is named in
                    -- confdelsetcols, or there is no list at all and every column
                    -- in the key is nulled.
                    and (c.confdelsetcols is null or k = any(c.confdelsetcols))
                );

              if bad is not null then
                raise exception
                  'These composite FKs would null a NOT NULL column on delete: %. Use: on delete set null (child_column)',
                  array_to_string(bad, ', ');
              end if;
              raise notice 'no composite FK nulls a NOT NULL column OK';
            end
            \$\$;
          "

      # Billing state is what the seller is charged and what they are allowed to
      # do. A client role that can write any of it can set its own status to
      # active, its own price to zero, or grant itself ten thousand SMS credits —
      # so every table in phase 19 is read-only to every client role, and
      # `platform_admins` is not even readable. There is no policy on that one on
      # purpose: a table that can grant membership of itself is the shortest
      # privilege-escalation path in any product.
      - name: A seller cannot write their own billing state
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              r text;
              t text;
              w text;
              leaked text[] := '{}';
            begin
              foreach r in array array['anon', 'authenticated'] loop
                foreach t in array array[
                  'plans', 'resellers', 'reseller_members', 'subscriptions',
                  'subscription_invoices', 'credit_purchases', 'announcements',
                  'impersonation_sessions'
                ] loop
                  foreach w in array array['INSERT', 'UPDATE', 'DELETE'] loop
                    if has_table_privilege(r, 'public.' || t, w) then
                      leaked := leaked || (r || ' can ' || w || ' ' || t)::text;
                    end if;
                  end loop;
                end loop;

                -- Nothing at all on the table that holds authority.
                foreach w in array array['SELECT', 'INSERT', 'UPDATE', 'DELETE'] loop
                  if has_table_privilege(r, 'public.platform_admins', w) then
                    leaked := leaked || (r || ' can ' || w || ' platform_admins')::text;
                  end if;
                end loop;

                -- anon has no business reading any of it either.
                if r = 'anon' then
                  foreach t in array array[
                    'plans', 'subscriptions', 'subscription_invoices',
                    'credit_purchases', 'impersonation_sessions'
                  ] loop
                    if has_table_privilege(r, 'public.' || t, 'SELECT') then
                      leaked := leaked || (r || ' can read ' || t)::text;
                    end if;
                  end loop;
                end if;
              end loop;

              if exists (select 1 from pg_policies
                         where schemaname = 'public' and tablename = 'platform_admins') then
                leaked := leaked || 'platform_admins has a policy'::text;
              end if;
              if not (select relrowsecurity from pg_class
                      where oid = 'public.platform_admins'::regclass) then
                leaked := leaked || 'RLS is off on platform_admins'::text;
              end if;

              if array_length(leaked, 1) > 0 then
                raise exception 'Billing state is writable: %', array_to_string(leaked, '; ');
              end if;
              raise notice 'billing state is read-only to every client role OK';
            end
            \$\$;
          "

      # The one rule this phase would be worth abandoning the rest of the phase
      # for. A plan limit is between Selld and the seller; the buyer is a stranger
      # who has never heard of either. Blocking their checkout because a card
      # bounced loses the seller the sale, and a seller who cannot take money
      # cancels rather than upgrades.
      #
      # Asserted functionally rather than by reading the trigger: put a store on a
      # zero-order plan, restrict it, and try to sell something.
      - name: A buyer can still check out of a store that has not paid us
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            begin;
            do \$\$
            declare
              v_t uuid;
              v_plan uuid;
              v_addr jsonb := '{\"regionCode\":\"130000000\",\"cityCode\":\"133900000\",
                                \"barangayCode\":\"133901001\",\"street\":\"21 Rizal\"}'::jsonb;
              v_blocked boolean := false;
            begin
              insert into public.tenants (name, slug) values ('CI Billing', 'ci-billing')
              returning id into v_t;

              insert into public.plans (code, name, price_centavos, limits, is_public)
              values ('ci-zero', 'Zero', 100,
                      '{\"maxProducts\": 0, \"maxUsers\": 0, \"maxOrdersPerMonth\": 0,
                        \"features\": []}'::jsonb, false)
              returning id into v_plan;

              update public.subscriptions set plan_id = v_plan, status = 'restricted'
               where tenant_id = v_t;

              -- Every channel a buyer can arrive through.
              insert into public.orders (tenant_id, order_number, shipping_address,
                contact_name, contact_phone, subtotal_centavos, grand_total_centavos,
                payment_method, source)
              values
                (v_t, 'CI-1', v_addr, 'Ana', '+639171234567', 10000, 10000, 'cod', 'storefront'),
                (v_t, 'CI-2', v_addr, 'Ana', '+639171234567', 10000, 10000, 'cod', 'live'),
                (v_t, 'CI-3', v_addr, 'Ana', '+639171234567', 10000, 10000, 'cod', 'marketplace');

              -- And the seller, who is the one the limit is actually about.
              begin
                insert into public.products (tenant_id, name, slug, status)
                values (v_t, 'Blocked', 'ci-blocked', 'active');
              exception when others then
                v_blocked := true;
              end;

              if not v_blocked then
                raise exception 'A restricted store was allowed to add a product';
              end if;
              if (select count(*) from public.orders where tenant_id = v_t) <> 3 then
                raise exception 'A buyer was refused because the seller had not paid';
              end if;
              raise notice 'the buyer path is never gated on billing OK';
            end
            \$\$;
            rollback;
          "

      # Support acting as a seller is the single most abusable capability in a
      # multi-tenant product, and 'we log it' is worth nothing if the log is
      # written by the same code path that could skip it. The access is derived
      # from the row, so these two properties are what make the row worth having:
      # the subject can read it, and nobody can edit it afterwards.
      - name: The impersonation log is append-only and its subject can read it
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              broken text[] := '{}';
            begin
              if not exists (
                select 1 from pg_trigger
                where tgrelid = 'public.impersonation_sessions'::regclass
                  and tgname = 'impersonation_append_only'
              ) then
                broken := broken || 'the append-only trigger is gone'::text;
              end if;

              -- A read policy has to exist, or the accountability is to us alone.
              if not exists (
                select 1 from pg_policies
                where schemaname = 'public' and tablename = 'impersonation_sessions'
                  and cmd = 'SELECT'
              ) then
                broken := broken || 'a seller cannot read their own stores rows'::text;
              end if;

              -- A reason is not optional, and neither is expiry.
              if not exists (
                select 1 from pg_attrdef d
                  join pg_attribute a on a.attrelid = d.adrelid and a.attnum = d.adnum
                where d.adrelid = 'public.impersonation_sessions'::regclass
                  and a.attname = 'expires_at'
              ) then
                broken := broken || 'an impersonation session no longer expires'::text;
              end if;
              if exists (
                select 1 from pg_attribute
                where attrelid = 'public.impersonation_sessions'::regclass
                  and attname = 'reason' and not attnotnull
              ) then
                broken := broken || 'a reason is no longer required'::text;
              end if;

              if array_length(broken, 1) > 0 then
                raise exception 'The impersonation audit trail is weakened: %',
                  array_to_string(broken, '; ');
              end if;
              raise notice 'the impersonation log is append-only and readable by its subject OK';
            end
            \$\$;
          "

      # Phase 20's own suite. It checks the tables nobody wrote an assertion for
      # — a table added six phases from now fails it by existing, which is the
      # only way a coverage check stays true.
      - name: RLS coverage, per table
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls-coverage.sql

      # A deletion request has to leave the seller's books intact. Deleting the
      # orders is the easy implementation and it would leave them unable to
      # answer BIR, unable to reconcile a courier statement, and with a revenue
      # figure that changed retroactively.
      - name: Erasure removes the person and keeps the transaction
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -c "
            begin;
            do \$\$
            declare
              v_t uuid; v_c uuid; v_o uuid; v_req uuid; v_user uuid;
              v_addr jsonb := '{\"regionCode\":\"130000000\",\"cityCode\":\"133900000\",
                                \"barangayCode\":\"133901001\",\"street\":\"21 Rizal\"}'::jsonb;
              v_total bigint; v_items int;
            begin
              insert into auth.users (id, email)
              values (gen_random_uuid(), 'ci-privacy@example.ph') returning id into v_user;
              insert into public.tenants (name, slug) values ('CI Privacy', 'ci-privacy')
              returning id into v_t;
              insert into public.tenant_members (tenant_id, user_id, role, accepted_at)
              values (v_t, v_user, 'owner', now());
              perform set_config('request.jwt.claim.sub', v_user::text, true);
              perform set_config('request.jwt.claims',
                json_build_object('sub', v_user, 'role', 'authenticated')::text, true);

              insert into public.customers (tenant_id, name, phone, email, source)
              values (v_t, 'Marites', '+639171230180', 'm@example.ph', 'storefront')
              returning id into v_c;
              insert into public.orders (tenant_id, order_number, customer_id, shipping_address,
                contact_name, contact_phone, subtotal_centavos, grand_total_centavos,
                payment_method, source)
              values (v_t, 'CI-1', v_c, v_addr, 'Marites', '+639171230180', 50000, 50000,
                      'cod', 'storefront')
              returning id into v_o;
              insert into public.order_items (tenant_id, order_id, product_name, sku, qty,
                unit_price_centavos, line_total_centavos)
              values (v_t, v_o, 'Serum', 'CI-S', 1, 50000, 50000);

              v_req := public.dsr_open(v_t, 'deletion', '+639171230180');
              perform public.dsr_serve_deletion(v_req);

              select grand_total_centavos into v_total from public.orders where id = v_o;
              select count(*) into v_items from public.order_items where order_id = v_o;

              if (select contact_phone from public.orders where id = v_o) = '+639171230180' then
                raise exception 'The phone survived an erasure';
              end if;
              if (select contact_name from public.orders where id = v_o) <> 'Erased' then
                raise exception 'The name survived an erasure';
              end if;
              if (select shipping_address ->> 'street' from public.orders where id = v_o)
                 is not null then
                raise exception 'The street survived an erasure';
              end if;
              if v_total <> 50000 then
                raise exception 'Erasure changed the revenue: %', v_total;
              end if;
              if v_items <> 1 then
                raise exception 'Erasure destroyed the line items the seller has to keep';
              end if;
              if (select shipping_address ->> 'cityCode' from public.orders where id = v_o)
                 is null then
                raise exception 'Erasure removed the city, which is a shipping zone, not a person';
              end if;
              raise notice 'erasure removes the person and keeps the books OK';
            end
            \$\$;
            rollback;
          "

      # Guard against the checked-in types drifting from the migrations. If this
      # fails, someone forgot `pnpm db:types` and the client types are lying.
      - name: database.types.ts matches the migrations
        run: |
          pnpm supabase gen types typescript \
            --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            > /tmp/generated.types.ts
          # Strip our hand-written header before comparing.
          tail -n +10 src/lib/supabase/database.types.ts > /tmp/committed.types.ts
          if ! diff -u /tmp/committed.types.ts /tmp/generated.types.ts; then
            echo "::error::src/lib/supabase/database.types.ts is stale. Run: pnpm db:types"
            exit 1
          fi
          echo "database.types.ts is up to date."
