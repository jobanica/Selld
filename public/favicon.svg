<!--
  The Selld mark. Same geometry as src/components/selld-logo.tsx — kept in step
  by hand, because a favicon cannot import a React component and a browser tab
  showing last season's logo is the one place nobody looks.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Selld">
  <defs>
    <linearGradient id="s" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3730d8" />
      <stop offset="1" stop-color="#5b78f7" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#s)" />
  <path d="M20.2 12.1c0-2.3-2.1-3.6-4.5-3.6-2.7 0-4.9 1.5-4.9 3.8 0 2.3 2.1 3.3 5.2 4s5.2 1.7 5.2 4c0 2.3-2.2 3.8-4.9 3.8-2.4 0-4.5-1.3-4.5-3.6" fill="none" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round" />
</svg>
